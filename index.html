<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CRAVEWORKS</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{

    position:relative;

    overflow:hidden;

    background-image:url("background.jpg");
    background-size:cover;
    background-position:center right;
    background-repeat:no-repeat;

    font-family:Arial,sans-serif;

}

/* 배경을 살짝 어둡게 */

body::before{

    content:"";

    position:absolute;

    inset:0;

    background:rgba(0,0,0,.28);

    z-index:0;

}

.container{

    position:relative;

    z-index:1;

    width:100%;
    height:100%;

    display:flex;
    align-items:center;

}

.content{

    width:360px;

    margin-left:8%;

    display:flex;
    flex-direction:column;

    align-items:center;

    text-align:center;

}

/* 로고 */

.logo{

    width:330px;

    display:block;

    margin-bottom:34px;

}

/* 브랜드 문구 */

.tagline{

    color:white;

    font-family:'Montserrat',sans-serif;

    font-style:italic;

    font-weight:700;

    font-size:20px;

    letter-spacing:-0.5px;

    line-height:1.08;

    margin-bottom:42px;

}

/* STORE */

.store-btn{

    display:inline-block;

    padding:14px 34px;

    border:1px solid rgba(255,255,255,.9);

    color:white;

    text-decoration:none;

    font-family:'Montserrat',sans-serif;

    font-style:italic;

    font-weight:700;

    font-size:16px;

    letter-spacing:4px;

    transition:.35s;

}

.store-btn:hover{

    background:white;

    color:black;

}

/* SNS */

.socials{

    display:flex;

    justify-content:center;

    gap:34px;

    margin-top:40px;

}

.socials a{

    color:white;

    text-decoration:none;

    font-family:'Montserrat',sans-serif;

    font-style:italic;

    font-weight:700;

    font-size:14px;

    letter-spacing:1px;

    transition:.3s;

}

.socials a:hover{

    opacity:.6;

}

/* 모바일 */

@media(max-width:900px){

body{

background-position:72% center;

}

.container{

justify-content:center;

}

.content{

margin:0;

width:90%;

}

.logo{

width:250px;

}

.tagline{

font-size:16px;

}

.store-btn{

padding:13px 30px;

font-size:15px;

}

.socials{

gap:22px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="content">

<img src="logo.png" class="logo" alt="CRAVEWORKS">

<div class="tagline">

genuine craftsmanship<br>
CRAVEWORKS Originals

</div>

<a class="store-btn" href="https://smartstore.naver.com/여기에스토어아이디" target="_blank">

STORE

</a>

<div class="socials">

<a href="https://instagram.com/계정명" target="_blank">Instagram</a>

<a href="mailto:contact@craveworks.co.kr">Contact</a>

</div>

</div>

</div>

</body>

</html>
