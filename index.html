<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CRAVEWORKS</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{

    width:100%;
    height:100%;

    overflow:hidden;

}


/* 배경 */

body{

    position:relative;

    background:#000;

    font-family:Arial,sans-serif;

}


/* 배경 이미지 */

.background{

    position:absolute;

    inset:-5%;

    background:url("background.jpg") 65% center / cover no-repeat;

    animation:zoomBackground 18s ease-in-out infinite alternate;

    z-index:0;

}


/* 배경 움직임 */

@keyframes zoomBackground{

    from{

        transform:scale(1);

    }

    to{

        transform:scale(1.05);

    }

}


/* 배경 어둡기 */

.background::after{

    content:"";

    position:absolute;

    inset:0;

    background:rgba(0,0,0,.35);

}



/* 전체 */

.container{

    position:relative;

    z-index:2;

    width:100%;

    height:100vh;

    display:flex;

    align-items:center;

}



/* 콘텐츠 */

.content{

    width:380px;

    margin-left:8%;

    display:flex;

    flex-direction:column;

    align-items:center;

    text-align:center;

    animation:contentFade 1.2s ease forwards;

}



/* 등장 */

@keyframes contentFade{

    from{

        opacity:0;

        transform:translateY(20px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}



/* 로고 */

.logo{

    width:330px;

    display:block;

    margin-bottom:34px;

    opacity:0;

    animation:logoFade .8s ease forwards;

    animation-delay:.2s;

}



@keyframes logoFade{

    from{

        opacity:0;

        transform:translateY(15px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}



/* 문구 */

.tagline{

    color:white;

    font-family:'Montserrat',sans-serif;

    font-style:italic;

    font-weight:700;

    font-size:20px;

    letter-spacing:-0.5px;

    line-height:1.08;

    margin-bottom:42px;

}



/* SHOP 버튼 */

.store-btn{

    display:inline-block;

    padding:14px 38px;

    border:1px solid rgba(255,255,255,.9);

    color:white;

    text-decoration:none;

.store-btn{

    display:inline-block;

    padding:14px 38px;

    border:1px solid rgba(255,255,255,.9);

    color:white;

    text-decoration:none;

    font-family:'Montserrat',sans-serif;

    font-style:italic;

    font-weight:700;

    font-size:16px;

    letter-spacing:2px;

    transition:.5s;

}

.store-btn span{

    display:inline-block;

    transform:translateX(2px);

}



/* SNS */

.socials{

    display:flex;

    justify-content:center;

    gap:34px;

    margin-top:40px;

}


.socials a{

    color:white;

    text-decoration:none;

    font-family:'Montserrat',sans-serif;

    font-style:italic;

    font-weight:700;

    font-size:14px;

    letter-spacing:1px;

    transition:.3s;

}


.socials a:hover{

    opacity:.6;

}



/* 모바일 */

@media(max-width:900px){


.background{

    background-position:65% center;

    background-size:cover;

}



.container{

    justify-content:center;

}



.content{

    margin:0;

    width:85%;

    transform:translateY(-20px);

}



.logo{

    width:190px;

    margin-bottom:28px;

}



.tagline{

    font-size:15px;

    line-height:1.2;

    margin-bottom:34px;

}



.store-btn{

    padding:12px 28px;

    font-size:14px;

    letter-spacing:2px;

}

.store-btn span{

    display:inline-block;

    transform:translateX(2px);

}



.socials{

    gap:22px;

    margin-top:32px;

}


}



</style>


</head>


<body>


<div class="background"></div>


<div class="container">


<div class="content">



<img src="logo.png" class="logo" alt="CRAVEWORKS">



<div class="tagline">

genuine craftsmanship<br>

CRAVEWORKS Originals

</div>



<a class="store-btn" href="https://mkt.shopping.naver.com/link/6818b9d3efd7a65d55474c24" target="_blank">

<span>SHOP</span>

</a>



<div class="socials">


<a href="https://instagram.com/craveworks_official" target="_blank">

Instagram

</a>


<a href="mailto:contact@craveworks.co.kr">

Contact

</a>


</div>



</div>


</div>



</body>

</html>
