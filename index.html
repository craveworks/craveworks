<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CRAVEWORKS</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


html,body{

width:100%;
height:100%;
overflow:hidden;

}


body{

background:#000;
font-family:Arial,sans-serif;

}



.background{

position:absolute;
inset:-5%;

background:url("background.jpg") 65% center / cover no-repeat;

animation:zoomBackground 18s ease-in-out infinite alternate;

z-index:0;

}



@keyframes zoomBackground{

from{
transform:scale(1);
}

to{
transform:scale(1.05);
}

}



.background::after{

content:"";

position:absolute;

inset:0;

background:rgba(0,0,0,.35);

}




.container{

position:relative;

z-index:2;

width:100%;

height:100vh;

display:flex;

align-items:center;

}




.content{

width:380px;

margin-left:8%;

display:flex;

flex-direction:column;

align-items:center;

text-align:center;

}




.logo{

width:330px;

margin-bottom:34px;

opacity:0;

animation:logoFade .8s forwards;

}




@keyframes logoFade{

from{

opacity:0;
transform:translateY(15px);

}

to{

opacity:1;
transform:translateY(0);

}

}




.tagline{

color:white;

font-family:'Montserrat',sans-serif;

font-style:italic;

font-weight:700;

font-size:20px;

letter-spacing:-0.5px;

line-height:1.08;

margin-bottom:42px;

}



/* SHOP 버튼 수정 */

.store-btn{


display:flex;

justify-content:center;

align-items:center;


width:150px;

height:48px;


border:1px solid rgba(255,255,255,.9);


color:white;

text-decoration:none;


font-family:'Montserrat',sans-serif;

font-style:italic;

font-weight:700;


font-size:16px;


letter-spacing:3px;


transition:.5s;


}




.store-btn:hover{

background:white;

color:black;

}




.socials{


display:flex;

justify-content:center;


gap:34px;


margin-top:40px;

}



.socials a{


color:white;

text-decoration:none;


font-family:'Montserrat',sans-serif;

font-style:italic;

font-weight:700;


font-size:14px;


letter-spacing:1px;


}




/* 모바일 */


@media(max-width:900px){


.background{

background-position:65% center;

}



.container{

justify-content:center;

}



.content{

width:85%;

margin:0;

transform:translateY(-20px);

}



.logo{

width:190px;

margin-bottom:28px;

}



.tagline{

font-size:15px;

margin-bottom:34px;

}



.store-btn{


width:130px;

height:42px;


font-size:14px;


}



.socials{

gap:22px;

margin-top:32px;

}


}



</style>


</head>


<body>


<div class="background"></div>


<div class="container">


<div class="content">


<img src="logo.png" class="logo">


<div class="tagline">

genuine craftsmanship<br>

CRAVEWORKS Originals

</div>



<a class="store-btn" href="https://smartstore.naver.com/여기에스토어주소" target="_blank">

SHOP

</a>



<div class="socials">


<a href="https://instagram.com/계정명">

Instagram

</a>


<a href="mailto:contact@craveworks.co.kr">

Contact

</a>


</div>


</div>


</div>


</body>


</html>
