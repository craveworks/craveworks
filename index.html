<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CRAVEWORKS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    background:
    linear-gradient(
        rgba(0,0,0,0.65),
        rgba(0,0,0,0.65)
    ),
    url("background.jpg");

    background-size: cover;
    background-position: center;

    color: white;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family: 'Inter', sans-serif;
}


.container {

    text-align:center;

    animation: fadeIn 2s ease;

}


/* 로고 들어갈 자리 */

.logo {

    margin-bottom:55px;

}


.logo img {

    width:260px;
    max-width:70vw;

}


/* 임시 로고 텍스트 */

.logo-text {

    font-family:'Cormorant Garamond', serif;

    font-size:52px;

    letter-spacing:8px;

}


.subtitle {

    font-size:14px;

    letter-spacing:5px;

    font-weight:300;

    margin-bottom:25px;

}


.originals {

    font-family:'Cormorant Garamond', serif;

    font-size:26px;

    letter-spacing:4px;

    margin-bottom:60px;

}


.shop {

    display:inline-block;

    border:1px solid white;

    padding:15px 70px;

    color:white;

    text-decoration:none;

    letter-spacing:5px;

    font-size:13px;

    transition:0.4s;

}


.shop:hover {

    background:white;

    color:black;

}


.links {

    margin-top:45px;

}


.links a {

    color:white;

    text-decoration:none;

    margin:0 18px;

    font-size:12px;

    letter-spacing:3px;

}


@keyframes fadeIn {

from {

opacity:0;
transform:translateY(20px);

}

to {

opacity:1;
transform:translateY(0);

}

}


@media(max-width:600px){

.logo-text {

font-size:36px;

letter-spacing:5px;

}


.subtitle {

font-size:11px;

}


.originals {

font-size:20px;

}


.shop {

padding:14px 50px;

}

}

</style>

</head>


<body>


<div class="container">


<div class="logo">

<div class="logo-text">
CRAVEWORKS
</div>

</div>


<div class="subtitle">
genuine craftsmanship
</div>


<div class="originals">
CRAVEWORKS Originals
</div>


<a class="shop" href="https://smartstore.naver.com/" >
SHOP
</a>


<div class="links">

<a href="#">Instagram</a>

<a href="#">Contact</a>

</div>


</div>


</body>
</html>
