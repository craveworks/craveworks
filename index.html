<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CRAVEWORKS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">


<style>

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body {

    height:100vh;

    background:#050505;

    color:white;

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:'Inter', sans-serif;

}



.container {

    text-align:center;

    animation:fadeIn 2s ease;

}



/* 로고 자리 */

.logo {

    margin-bottom:55px;

}


.logo-text {

    font-family:'Cormorant Garamond', serif;

    font-size:52px;

    letter-spacing:8px;

}



/* 브랜드 문구 */

.brand-line {

    font-family:'Inter', sans-serif;

    font-size:18px;

    font-weight:700;

    font-style:italic;

    letter-spacing:3px;

    line-height:1.35;

    margin-bottom:60px;

}



/* SHOP 버튼 */

.shop {

    display:inline-block;

    border:1px solid white;

    padding:15px 70px;

    color:white;

    text-decoration:none;

    letter-spacing:5px;

    font-size:13px;

    transition:0.4s;

}


.shop:hover {

    background:white;

    color:black;

}



/* 링크 */

.links {

    margin-top:45px;

}



.links a {

    color:white;

    text-decoration:none;

    margin:0 18px;

    font-size:12px;

    font-weight:400;

    letter-spacing:3px;

}



/* 등장 효과 */

@keyframes fadeIn {

from {

    opacity:0;

    transform:translateY(20px);

}


to {

    opacity:1;

    transform:translateY(0);

}

}



/* 모바일 */

@media(max-width:600px){


.logo-text {

    font-size:36px;

    letter-spacing:5px;

}


.brand-line {

    font-size:16px;

    letter-spacing:2px;

    line-height:1.3;

}


.shop {

    padding:14px 50px;

}


}



</style>


</head>


<body>


<div class="container">


<div class="logo">

<div class="logo-text">

CRAVEWORKS

</div>

</div>



<div class="brand-line">

genuine craftsmanship<br>

CRAVEWORKS Originals

</div>



<a class="shop" href="https://smartstore.naver.com/">

SHOP

</a>



<div class="links">

<a href="#">Instagram</a>

<a href="#">Contact</a>

</div>



</div>


</body>

</html>
