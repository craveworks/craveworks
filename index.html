<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CRAVEWORKS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;1,700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{

width:100%;
height:100%;
overflow:hidden;

font-family:'Inter',sans-serif;
color:white;

}

/* ---------- 배경 ---------- */

body{

background:url("background.jpg") no-repeat right center;
background-size:cover;

display:flex;
justify-content:flex-start;
align-items:center;

animation:bgZoom 18s ease-in-out infinite alternate;

}

body::before{

content:"";
position:fixed;
left:0;
top:0;
width:100%;
height:100%;

background:rgba(0,0,0,.35);

z-index:-1;

}

@keyframes bgZoom{

from{

background-size:100%;

}

to{

background-size:104%;

}

}

/* ---------- 내용 ---------- */

.container{

margin-left:9%;

display:flex;
flex-direction:column;
align-items:flex-start;

animation:fadeUp 1.4s ease;

}

@keyframes fadeUp{

from{

opacity:0;
transform:translateY(20px);

}

to{

opacity:1;
transform:translateY(0);

}

}

/* ---------- 로고 ---------- */

.logo{

width:430px;
max-width:80vw;

margin-bottom:22px;

}

/* ---------- 브랜드 문구 ---------- */

.tagline{

font-size:18px;

font-weight:700;

font-style:italic;

letter-spacing:2px;

line-height:1.08;

margin-bottom:42px;

}

/* ---------- 버튼 ---------- */

.store{

display:inline-block;

padding:14px 40px;

border:1px solid rgba(255,255,255,.85);

text-decoration:none;

color:white;

font-size:13px;

font-weight:700;

font-style:italic;

letter-spacing:5px;

transition:.35s;

}

.store:hover{

background:white;

color:black;

}

/* ---------- 하단 ---------- */

.links{

margin-top:34px;

}

.links a{

color:white;

text-decoration:none;

margin-right:26px;

font-size:12px;

font-style:italic;

font-weight:700;

letter-spacing:2px;

transition:.3s;

}

.links a:hover{

opacity:.6;

}

/* ---------- 모바일 ---------- */

@media(max-width:768px){

body{

background-position:70% center;

}

.container{

margin-left:30px;
margin-right:30px;

}

.logo{

width:280px;

}

.tagline{

font-size:15px;

}

.store{

padding:13px 32px;

}

}

</style>

</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<div class="tagline">

genuine craftsmanship<br>

CRAVEWORKS Originals

</div>

<a class="store" href="https://smartstore.naver.com/여기에스토어주소">

STORE

</a>

<div class="links">

<a href="#">Instagram</a>

<a href="#">Contact</a>

</div>

</div>

</body>

</html>
