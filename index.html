<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CRAVEWORKS</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;

    background:url("background2.jpg") center center/cover no-repeat;
    font-family:Arial,sans-serif;
}

body::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.25);
}

.container{
    position:relative;
    z-index:2;

    width:100%;
    height:100vh;

    display:flex;
    align-items:center;
}

.content{

    width:420px;

    margin-left:8%;

    display:flex;
    flex-direction:column;

    align-items:center;

    text-align:center;
}

.logo{

    width:360px;

    display:block;

    margin-bottom:42px;

}

.tagline{

    font-family:'Montserrat',sans-serif;

    font-style:italic;

    font-weight:700;

    font-size:21px;

    letter-spacing:-0.6px;

    line-height:1.12;

    margin-bottom:48px;

}

.store-btn{

    display:inline-block;

    padding:16px 36px;

    border:1px solid rgba(255,255,255,.9);

    color:#fff;

    text-decoration:none;

    font-family:'Montserrat',sans-serif;

    font-style:italic;

    font-weight:700;

    font-size:17px;

    letter-spacing:4px;

    transition:.35s;

}

.store-btn:hover{

    background:white;

    color:black;

}

.socials{

    display:flex;

    justify-content:center;

    gap:38px;

    margin-top:46px;

}

.socials a{

    color:white;

    text-decoration:none;

    font-family:'Montserrat',sans-serif;

    font-style:italic;

    font-weight:700;

    font-size:15px;

    letter-spacing:1px;

    transition:.3s;

}

.socials a:hover{

    opacity:.6;

}

@media(max-width:900px){

body{

background-position:75% center;

}

.content{

margin:auto;

width:90%;

}

.logo{

width:270px;

}

.tagline{

font-size:17px;

}

.store-btn{

padding:14px 30px;

font-size:15px;

}

.socials{

gap:25px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="content">

<img src="logo.png" class="logo" alt="CRAVEWORKS">

<div class="tagline">

genuine craftsmanship<br>

CRAVEWORKS Originals

</div>

<a class="store-btn" href="https://smartstore.naver.com/크레이브웍스" target="_blank">

STORE

</a>

<div class="socials">

<a href="https://instagram.com/계정명" target="_blank">Instagram</a>

<a href="mailto:contact@craveworks.co.kr">Contact</a>

</div>

</div>

</div>

</body>

</html>
